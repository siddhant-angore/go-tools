name: NAV sync

on:
    schedule:
        # Times are UTC, always. 15:45 UTC is 21:15 IST, 02:30 UTC is 08:00 IST.
        # Day-of-week 1-5 is Mon-Fri and 2-6 is Tue-Sat, so neither fires on a
        # Sunday and only the second fires on a Saturday.
        # GitHub delays scheduled runs, routinely by 10-20 minutes. Treat these
        # as "no earlier than", never as an exact time.
        - cron: '45 15 * * 1-5'
        - cron: '30 2 * * 2-6'
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - run: flyctl machine start 080d74db696298 -a go-tools
              env:
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
