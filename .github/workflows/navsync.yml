name: NAV sync

on:
    schedule:
        # TEMPORARY, remove after today. Day-of-month 8 and month 8 mean these
        # fire once, on 8 Aug, and never again. They exist to prove a scheduled
        # trigger fires at all: every run so far has been workflow_dispatch,
        # which cannot tell us anything about the schedule.
        - cron: '46 16 8 8 *'
        - cron: '10 17 8 8 *'
        - cron: '45 15 * * 1-5'
        - cron: '30 2 * * 2-6'
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - run: flyctl machine start 080d74db696298 -a go-tools
              env:
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
