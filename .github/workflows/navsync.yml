name: NAV sync

on:
    schedule:
        - cron: '35 12 * * 1-5'
        - cron: '30 2 * * 2-6'
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - run: flyctl machine start 080d74db696298 -a go-tools
              env:
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
